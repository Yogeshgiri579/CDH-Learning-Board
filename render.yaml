# Render Blueprint Configuration (render.yaml)
# CloudDevOpsHub 55-Session LMS Monorepo Deployment
version: "1"

services:
  # ==========================================
  # 1. Express Backend Web Service
  # ==========================================
  - type: web
    name: learnwithcdh-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # ==========================================
  # 2. Student LMS Web Application (Static Site)
  # ==========================================
  - type: static
    name: learnwithcdh-lms
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ==========================================
  # 3. Admin CMS Control Panel (Static Site)
  # ==========================================
  - type: static
    name: learnwithcdh-admin
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
